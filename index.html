  <body class="bg-[#030014] text-gray-200 font-sans antialiased transition-colors duration-300">
    <div id="initial-loader" role="status" aria-live="polite">
      <div class="loader-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cosmic-loader" aria-hidden="true">
        <span class="cosmic-orbit cosmic-orbit--outer"></span><span class="cosmic-orbit cosmic-orbit--inner"></span><span class="cosmic-core"></span>
      </div>
      <span class="loader-label">Preparando constelações</span><span class="sr-only">Carregando portfólio</span>
    </div>
    <script>
      if (sessionStorage.getItem('wsp-portfolio-intro-played') !== 'true' && !/\/projetos\//.test(location.pathname)) {
        document.getElementById('initial-loader').classList.add('is-first-visit')
      }
    </script>
    <div id="root"></div>
    <style>
      #initial-loader { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; background:radial-gradient(circle at 50% 44%,#18114c 0%,#07051d 37%,#030014 72%); color:#d8c7ff; font-family:Inter,system-ui,sans-serif; transition:opacity 220ms ease-out,visibility 220ms ease-out; }
      #initial-loader.is-ready { opacity:0; visibility:hidden; pointer-events:none; }
      #initial-loader.is-first-visit .cosmic-orbit, #initial-loader.is-first-visit .loader-stars, #initial-loader.is-first-visit .loader-label { display:none; }
      #initial-loader.is-first-visit .cosmic-core { width:26px; height:26px; }
      .cosmic-loader { position:relative; width:92px; height:92px; }
      .cosmic-core { position:absolute; top:50%; left:50%; width:18px; height:18px; border-radius:999px; transform:translate(-50%,-50%); background:#f4f0ff; box-shadow:0 0 14px #fff,0 0 34px #8b5cf6,0 0 64px #3b82f6; animation:cosmic-pulse 1.5s ease-in-out infinite; }
      .cosmic-orbit { position:absolute; top:50%; left:50%; border:1px solid rgba(167,139,250,.55); border-radius:999px; transform:translate(-50%,-50%) rotate(-22deg); }
      .cosmic-orbit::after { content:''; position:absolute; top:-3px; left:50%; width:6px; height:6px; border-radius:999px; background:#67e8f9; box-shadow:0 0 10px #67e8f9; }
      .cosmic-orbit--outer { width:88px; height:38px; animation:cosmic-orbit 2.2s ease-in-out infinite; }
      .cosmic-orbit--inner { width:56px; height:82px; border-color:rgba(96,165,250,.45); animation:cosmic-orbit-reverse 1.8s ease-in-out infinite; }
      .cosmic-orbit--inner::after { background:#c4b5fd; box-shadow:0 0 10px #c4b5fd; }
      .loader-stars i { position:absolute; width:3px; height:3px; border-radius:999px; background:#e9e3ff; box-shadow:0 0 8px #c4b5fd; animation:star-twinkle 1.6s ease-in-out infinite; }
      .loader-stars i:nth-child(1) { margin:-102px 0 0 -125px; }.loader-stars i:nth-child(2) { margin:-68px 0 0 132px; animation-delay:.2s; }.loader-stars i:nth-child(3) { margin:78px 0 0 -112px; animation-delay:.5s; }.loader-stars i:nth-child(4) { margin:106px 0 0 104px; animation-delay:.8s; }.loader-stars i:nth-child(5) { margin:-142px 0 0 16px; animation-delay:1.1s; }
      .loader-label { margin-top:24px; color:#c4b5fd; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      @keyframes cosmic-pulse { 50% { transform:translate(-50%,-50%) scale(1.3); opacity:.82; } }@keyframes cosmic-orbit { 50% { transform:translate(-50%,-50%) rotate(158deg) scale(1.04); } 100% { transform:translate(-50%,-50%) rotate(338deg); } }@keyframes cosmic-orbit-reverse { 50% { transform:translate(-50%,-50%) rotate(-202deg) scale(.96); } 100% { transform:translate(-50%,-50%) rotate(-382deg); } }@keyframes star-twinkle { 50% { transform:scale(1.8); opacity:.35; } }
      @media (prefers-reduced-motion:reduce) { .cosmic-core,.cosmic-orbit,.loader-stars i { animation:none; } #initial-loader { transition-duration:0ms; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
